[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dfinery1-bigdata-export"
version = "0.1.0"
description = "DFINERY 빅데이터 Raw Data Export 자동화 도구"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "playwright>=1.40",
]

[project.scripts]
dfinery1-bigdata-export = "dfinery1_bigdata_export.cli:main"
